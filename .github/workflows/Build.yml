name: Build Minimal FFmpeg 7.1 for Android ARMv8 (Cut Only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FFmpeg Source
        uses: actions/checkout@v4
        with:
          repository: 'FFmpeg/FFmpeg'
          ref: 'release/7.1'

      - name: Install Build Tools
        run: |
          sudo apt-get update
          # تم حذف yasm و nasm لعدم الحاجة لهما في معمارية ARM
          sudo apt-get install -y build-essential pkg-config git

      - name: Configure and Compile for ARMv8 (Stream Copy Only)
        run: |
          export NDK=$ANDROID_NDK_HOME
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          API=21
          TARGET=aarch64-linux-android
          
          export AR=$TOOLCHAIN/bin/llvm-ar
          export CC=$TOOLCHAIN/bin/$TARGET$API-clang
          export CXX=$TOOLCHAIN/bin/$TARGET$API-clang++
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip

          ./configure \
            --target-os=android \
            --arch=aarch64 \
            --cpu=armv8-a \
            --enable-cross-compile \
            --cc="$CC" \
            --ar="$AR" \
            --ranlib="$RANLIB" \
            --strip="$STRIP" \
            --disable-doc \
            --disable-encoders \
            --disable-filters \
            --prefix=./android/armv8

          make -j$(nproc)
          make install

      - name: Upload FFmpeg Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-7.1-armv8-android-cut-only
          path: ./android/armv8/bin/ffmpeg
